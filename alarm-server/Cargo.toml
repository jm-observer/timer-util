[package]
name = "alarm-server"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "alarm-server"
path = "src/main.rs"

[[bin]]
name = "alarm-cli"
path = "src/bin/alarm-cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
timer-util = { path = "..", features = ["serde"] }
actix-web = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tokio-util = "0.7"
# 临时 git rev 依赖（trace-hub DESIGN §7.6 选项 B）以启用 trace feature 中的
# 新 task-local；发布前按选项 A 改回 crates.io 版本依赖。改 git rev 是为了
# Docker 交叉编译时容器只需挂当前仓——记入用户级 memory：兄弟仓 path 必须先
# commit+push 改 rev。
custom-utils = { git = "https://github.com/jm-observer/custom-utils.git", rev = "cc6885fc1fb852bf8f76150898cb6c71deb291a1", default-features = false, features = ["updater", "logger", "trace"] }
toml = "0.8"
anyhow = "1"

[features]
default = []
prod = ["custom-utils/prod"]